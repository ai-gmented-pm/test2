# Généré par Amorce (brique : standup_slack). Modifiez-le depuis le tableau de bord de l'équipe : une édition manuelle ici sera écrasée au prochain push.

# Rappel de standup généré par Amorce.
# Cadence : quotidienne, du lundi au vendredi, à 09:30 (heure de Paris).
# Les crons ci-dessous sont en UTC (heure d'hiver, Paris = UTC+1) :
# en heure d'été, décalez-les d'une heure de plus.
# Le webhook n'est PAS dans ce fichier : il vit dans les secrets du repo
# (SLACK_WEBHOOK_URL). Mode d'emploi : docs/STANDUP.md.
name: Rappel de standup
on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:

jobs:
  rappel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Poster le rappel dans Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Le message passe par l'environnement, jamais interpolé dans
          # la commande : c'est ce qui empêche une injection shell
          # depuis les paramètres de la brique.
          MESSAGE_STANDUP: ":wave: Standup #projet — 09:30 (heure de Paris).\\n• Qu'est-ce que j'ai terminé ?\\n• Qu'est-ce que je vise aujourd'hui ?\\n• Qu'est-ce qui me bloque ?"
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::Secret SLACK_WEBHOOK_URL absent — voir docs/STANDUP.md, etape 3."
            exit 0
          fi
          jq -n --arg texte "$MESSAGE_STANDUP" '{text: $texte}' \
            | curl -sS -X POST -H 'Content-type: application/json' \
                --data @- "$SLACK_WEBHOOK_URL"
